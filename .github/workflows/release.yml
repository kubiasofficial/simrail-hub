name: Vydání pro Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Ověření verze tagu
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag neodpovídá package.json' }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Veřejné vydání
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(),[IO.Path]::GetFileName($_.Path) } | Set-Content release/SHA256SUMS.txt
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; keeping its reviewed assets unchanged."
            exit 0
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title "SimRail Hub $version" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Vytvoření vydání selhalo' }
          $assets = @("release/SimRail-Hub-Portable-$version.exe", "release/SimRail-Hub-Setup-$version.exe", "release/SHA256SUMS.txt", "release/latest.yml")
          $assets += @(Get-ChildItem release/*.blockmap | ForEach-Object { $_.FullName })
          $banner = "public/assets/releases/$version.png"
          if (Test-Path $banner) {
            $bannerAsset = "release/SimRail-Hub-$version-banner.png"
            Copy-Item $banner $bannerAsset
            $assets += $bannerAsset
          }
          gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Nahrání vydání selhalo' }
          gh release edit $tag --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Zveřejnění vydání selhalo' }
