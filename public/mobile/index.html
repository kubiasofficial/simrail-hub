<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10171c"><title>SimRail Hub · Na cestě</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><small>SIMRAIL / HUB · MOBILNÍ DISPLEJ</small><h1 id="train">Načítám vlak…</h1></div><span id="connection" role="status">Připojuji…</span></header><p id="route" class="route"></p><p id="message" role="status"></p>
<main><section id="overview" class="view"><div class="journey"><div class="minor"><span>Předchozí</span><strong id="previous">—</strong></div><div class="minor current"><span>Aktuální</span><strong id="current">—</strong></div><div class="up-next"><span>DALŠÍ ZASTÁVKA</span><h2 id="next">—</h2><p id="distance">—</p></div></div><div class="metrics"><article><span>Rychlost</span><strong><b id="speed">—</b><small>km/h</small></strong></article><article id="delay-card"><span id="delay-label">Zpoždění</span><strong id="delay">—</strong><small id="delay-note">Čekám na data</small></article></div></section>
<section id="schedule" class="view" hidden><div class="section-title"><h2>Jízdní řád</h2><label><input id="technical" type="checkbox"> I průjezdy a technické body</label></div><div id="journey"></div><p id="empty-schedule" hidden>Pro tento vlak nejsou dostupné zastávky.</p></section>
<section id="map-view" class="view" hidden><div class="map-controls"><button id="follow" aria-pressed="true">Sledovat vlak</button><button id="return">Zpět na vlak</button><button id="fit">Celý úsek</button></div><div id="map" aria-label="Mapa vlaku a stanic"></div><p id="map-status" role="status">Mapa se načte při otevření.</p></section>
</main><footer><span id="age">Čekám na data</span><span>Hlášení přehrává počítač</span></footer><nav aria-label="Mobilní zobrazení"><button data-tab="overview" aria-pressed="true">Přehled</button><button data-tab="schedule" aria-pressed="false">Jízdní řád</button><button data-tab="map-view" aria-pressed="false">Mapa</button></nav><script src="/app.js"></script></body></html>
